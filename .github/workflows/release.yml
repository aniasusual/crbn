name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_cmd: npm run dist:mac:all
            artifact_pattern: 'frontend/release/*.zip,frontend/release/*.dmg'
          - os: windows-latest
            build_cmd: npm run dist:win
            artifact_pattern: 'frontend/release/*.zip,frontend/release/*.exe'
          - os: ubuntu-latest
            build_cmd: npm run dist:linux
            artifact_pattern: 'frontend/release/*.tar.gz,frontend/release/*.AppImage,frontend/release/*.deb'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Install Monorepo & Backend Dependencies
        shell: bash
        run: |
          bun install --cwd pi-harness
          bun install --cwd backend
          bun install --cwd backend/templates/node_react
      - name: Install Frontend Dependencies
        shell: bash
        run: |
          cd frontend
          npm install

      - name: Run Backend Subsystem & Integration Tests
        shell: bash
        run: |
          cd backend
          bun test

      - name: Verify Frontend Production Build
        shell: bash
        run: |
          cd frontend
          npm run build

      - name: Package Desktop App
        shell: bash
        run: |
          cd frontend
          ${{ matrix.build_cmd }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_pattern }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
